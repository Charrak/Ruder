; ESP32-Firmware für das Ruder-Dashboard (Concept2 Model C ohne USB)
;
; Flashen:
;   pio run -t upload
;   pio device monitor          ; 115200 Baud
;
; Upload per WLAN (nach dem ersten USB-Flash):
;   pio run -t upload --upload-port ruder-sensor.local

[env:esp32dev]
platform = espressif32@^6.7.0
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; WLAN-Zugangsdaten und Sensor-Pin stehen in include/config.h
    ; (Vorlage: include/config.example.h)

lib_deps =
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.0.4

board_build.f_cpu = 240000000L
